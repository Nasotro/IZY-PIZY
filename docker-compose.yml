services:
  backend:
    build:
      context: .
      dockerfile: izyPizy/Dockerfile.backend
    expose:
      - "8000"
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: izyPizy/Dockerfile.frontend
    ports:
      - "5173:8080"
    depends_on:
      - backend

volumes:
  app-data: